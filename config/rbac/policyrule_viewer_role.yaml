# permissions for end users to view policyrules.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: policy-enforcer-operator
    app.kubernetes.io/managed-by: kustomize
  name: policyrule-viewer-role
rules:
- apiGroups:
  - policy.cloudwithdeethesh.com
  resources:
  - policyrules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - policy.cloudwithdeethesh.com
  resources:
  - policyrules/status
  verbs:
  - get
