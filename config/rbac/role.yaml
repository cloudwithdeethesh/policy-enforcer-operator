---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy.cloudwithdeethesh.com
  resources:
  - policyenforcements
  - policyrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy.cloudwithdeethesh.com
  resources:
  - policyenforcements/finalizers
  - policyrules/finalizers
  verbs:
  - update
- apiGroups:
  - policy.cloudwithdeethesh.com
  resources:
  - policyenforcements/status
  - policyrules/status
  verbs:
  - get
  - patch
  - update
