# permissions for end users to edit policyenforcements.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: policy-enforcer-operator
    app.kubernetes.io/managed-by: kustomize
  name: policyenforcement-editor-role
rules:
- apiGroups:
  - policy.cloudwithdeethesh.com
  resources:
  - policyenforcements
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy.cloudwithdeethesh.com
  resources:
  - policyenforcements/status
  verbs:
  - get
